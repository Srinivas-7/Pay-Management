<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Records | Payroll</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main>
    <div class="mb-4">
      <h1>Past Payroll Records</h1>
      <p>A history of all saved payslips. You can view individual calculations or delete archieved data.</p>
    </div>

    <div id="alert-container"></div>

    <div class="table-responsive">
      <table id="records-table">
        <thead>
          <tr>
            <th>Employee ID</th>
            <th>Leaves</th>
            <th>Overtime (hrs)</th>
            <th>Conveyance</th>
            <th>Generated Date</th>
            <th>Payslip</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="records-tbody">
          <tr>
            <td colspan="7" class="text-center" style="padding: 2rem; color: var(--text-secondary);">Loading past records...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', fetchRecords);

    async function fetchRecords() {
      const tbody = document.getElementById('records-tbody');
      try {
        const response = await fetch('/api/records');
        const result = await response.json();

        if (response.ok && result.success) {
          const records = result.data;
          
          if (records.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="7" class="text-center" style="padding: 3rem;">
                  <p class="text-danger" style="font-size: 1.25rem; font-weight: 600; margin-bottom: 0;">No Records Found!</p>
                </td>
              </tr>
            `;
            return;
          }

          tbody.innerHTML = records.map(rec => {
            const dateStr = new Date(rec.created_at).toLocaleString();
            return `
              <tr>
                <td><strong>${rec.employee_id}</strong></td>
                <td>${rec.leaves}</td>
                <td>${rec.overtime}</td>
                <td>${rec.conveyence}</td>
                <td>${dateStr}</td>
                <td>
                  <a href="pay.html?id=${rec.employee_id}&leave=${rec.leaves}&overtime=${rec.overtime}&conveyence=${rec.conveyence}&saved=true" class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.85rem;">
                    Payslip
                  </a>
                </td>
                <td>
                  <button onclick="deleteRecord(${rec.record_id})" class="btn btn-danger" style="padding: 0.25rem 0.75rem; font-size: 0.85rem;">
                    Delete
                  </button>
                </td>
              </tr>
            `;
          }).join('');

        } else {
          showAlert('alert-container', result.error || 'Failed to fetch records.');
          tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Error loading data.</td></tr>`;
        }
      } catch (err) {
        console.error(err);
        showAlert('alert-container', 'Network error while loading records.');
      }
    }

    async function deleteRecord(recordId) {
      if (!confirm('Are you sure you want to delete this payroll record?')) return;
      
      try {
        const response = await fetch(`/api/records/${recordId}`, {
          method: 'DELETE'
        });
        const result = await response.json();

        if (response.ok && result.success) {
          showAlert('alert-container', 'Record Deleted!', 'success');
          fetchRecords();
        } else {
          showAlert('alert-container', result.error || 'Failed to delete record.');
        }
      } catch (err) {
        console.error(err);
        showAlert('alert-container', 'Network error. Failed to delete record.');
      }
    }
  </script>
</body>
</html>
