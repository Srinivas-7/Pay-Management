<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Employee | Payroll</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main>
    <div class="card" style="max-width: 680px; margin: 0 auto;">
      <h2>Add New Employee</h2>
      <p>Register a new employee with basic details and salary configuration.</p>

      <div id="alert-container"></div>

      <form id="add-employee-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Name" required>
          </div>
          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label>Gender</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="gender" value="male" checked> Male
            </label>
            <label class="radio-label">
              <input type="radio" name="gender" value="female"> Female
            </label>
            <label class="radio-label">
              <input type="radio" name="gender" value="other"> Other
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" class="form-control" placeholder="Address" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="Phone" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="Email" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="branch">Branch Office</label>
            <input type="text" id="branch" class="form-control" placeholder="Branch" required>
          </div>
          <div class="form-group">
            <label for="department">Designation / Department</label>
            <input type="text" id="department" class="form-control" placeholder="Designation" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="startdate">Joining Date</label>
            <input type="date" id="startdate" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="basic">Basic Pay (Monthly)</label>
            <input type="number" id="basic" class="form-control" placeholder="Basic pay" required>
          </div>
        </div>

        <div class="form-group">
          <label>Shift Schedule</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="shift" value="day" checked> Day
            </label>
            <label class="radio-label">
              <input type="radio" name="shift" value="night"> Night
            </label>
          </div>
        </div>

        <div class="mt-4" style="display: flex; gap: 1rem;">
          <button type="submit" class="btn btn-primary">Save Employee</button>
          <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">Cancel</button>
        </div>
      </form>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('add-employee-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        name: document.getElementById('name').value.trim(),
        dob: document.getElementById('dob').value,
        gender: document.querySelector('input[name="gender"]:checked').value,
        address: document.getElementById('address').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        branch: document.getElementById('branch').value.trim(),
        department: document.getElementById('department').value.trim(),
        startdate: document.getElementById('startdate').value,
        shift: document.querySelector('input[name="shift"]:checked').value,
        basic: document.getElementById('basic').value
      };

      try {
        const response = await fetch('/api/employees', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showAlert('alert-container', result.message || 'Employee data saved!', 'success');
          document.getElementById('add-employee-form').reset();
        } else {
          showAlert('alert-container', result.error || 'Failed to save employee.');
        }
      } catch (err) {
        console.error(err);
        showAlert('alert-container', 'Network error. Please try again.');
      }
    });
  </script>
</body>
</html>
