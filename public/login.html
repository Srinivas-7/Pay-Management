<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Payroll</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="login-wrapper">
    <div class="card login-card">
      <h2 class="text-center">Admin Login</h2>
      <p class="text-center">Access the Payroll management system</p>
      
      <div id="alert-container"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Admin Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter Admin Username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter Password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-4">Login</button>
      </form>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const usernameVal = document.getElementById('username').value.trim();
      const passwordVal = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_name: usernameVal, password: passwordVal })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          window.location.href = 'index.html';
        } else {
          showAlert('alert-container', result.error || 'Invalid credentials.');
        }
      } catch (err) {
        console.error(err);
        showAlert('alert-container', 'Network error. Please try again.');
      }
    });
  </script>
</body>
</html>
